version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    container_name: market_place_db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: backend_development
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
